# ══════════════════════════════════════════════════════════
# GitHub Actions CI 工作流
#
# 在 push / PR 到 main 分支时自动构建 Debug APK。
# 支持手动触发（workflow_dispatch），可选择清除 Gradle 缓存。
# ══════════════════════════════════════════════════════════

name: Build

# ── 触发条件 ──
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # 手动触发
    inputs:
      clear_cache:
        description: "清除 Gradle 缓存后重新构建"
        type: boolean
        default: false

# ── 并发控制：同一分支同时只运行一个工作流 ──
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # 构建超时时间

    permissions:
      contents: read

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1     # 浅克隆，加速检出

      # 2. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3. 配置 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.clear_cache }}

      # 4. 赋予 gradlew 执行权限
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. （可选）清除 Gradle 缓存
      - name: Clear Gradle cache
        if: ${{ inputs.clear_cache }}
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          echo "Gradle 缓存已清除"

      # 6. 验证 Gradle 版本
      - name: Verify Gradle wrapper
        run: ./gradlew --version

      # 7. 构建 Debug APK
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 8. 上传 Debug APK 文件
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 14    # 保留 14 天

      # 9. 上传构建日志（无论构建成功与否）
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/
            **/build/reports/
            **/build/logs/
          if-no-files-found: ignore
          retention-days: 7
